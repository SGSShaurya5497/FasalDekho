name: AgriShield AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run Pytest Suite & Code Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Tests
        run: |
          pytest backend/tests -v

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Backend Docker Image
        run: |
          docker build -t agrishield-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t agrishield-frontend:latest ./frontend
